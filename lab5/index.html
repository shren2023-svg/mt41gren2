<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота №5 — CSS Box Model</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="logos_container" role="link" aria-label="Featured University Units">
    <div class="container">
      <div class="region region-logos">
        <div class="row">
          <div class="col">
            <a href="http://tsus.lpnu.ua/">
              <img src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_tech-startup-school.png"
                   alt="Логотип Tech Startup School"
                   class="logo-img">
            </a>
          </div>
          <div class="col">
            <a href="https://techbs.lpnu.ua/">
              <img src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_tech-business-school.png"
                   alt="Логотип Tech Business School"
                   class="logo-img">
            </a>
          </div>
          <div class="col">
            <a href="http://tsus.lpnu.ua/sid">
              <img src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_SID-city-scientific-park.png"
                   alt="Логотип наукового парку SID City"
                   class="logo-img">
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

</body>
</html>
